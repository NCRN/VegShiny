<!DOCTYPE html>


<!-- Global site tag (gtag.js) - Google Analytics -->

<script async src="https://www.googletagmanager.com/gtag/js?id=G-LYY1GJS9EM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-LYY1GJS9EM');

// widget event trackers (from ui)

  // ---------------- MAP PANEL ----------------
  // Selects
  $(document).on('change', '#MapGroup', function(e) {
    gtag('event', 'map_group_change', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#TreeStatus', function(e) {
    gtag('event', 'tree_status_change', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#MapLayer', function(e) {
    gtag('event', 'map_layer_add', { layer: $(e.currentTarget).val() });
  });

  // Checkbox
  $(document).on('change', '#mapCommon', function(e) {
    gtag('event', 'map_common_toggle', { enabled: e.currentTarget.checked ? 'true' : 'false' });
  });

  // Radio (PlotSize)
  $(document).on('change', 'input[name="PlotSize"]', function(e) {
    gtag('event', 'plot_size_select', { multiplier: $(e.currentTarget).val() });
  });

  // Buttons
  $(document).on('click', '#AboutMapButton', function() {
    gtag('event', 'about_map_open', { });
  });
  $(document).on('click', '#MapZoom', function() {
    // If ParkZoom select exists, include it
    var park = $('#ParkZoom').val() || null;
    gtag('event', 'map_zoom_go', { park: park });
  });
  $(document).on('click', '#CloseAboutMap', function() {
    gtag('event', 'about_map_close', { });
  });

  // Leaflet map (via shiny:inputchanged)
  (function(){
    var boundsTimer = null;
    document.addEventListener('shiny:inputchanged', function(e) {
      var id = e.name, val = e.value;

      if (id === 'VegMap_zoom') {
        gtag('event', 'map_zoom', { zoom: val });
      }
      if (id === 'VegMap_bounds') {
        if (boundsTimer) clearTimeout(boundsTimer);
        boundsTimer = setTimeout(function(){
          if (val && typeof val === 'object') {
            gtag('event', 'map_move', {
              north: val.north, east: val.east, south: val.south, west: val.west
            });
          }
        }, 500); // throttle
      }
    });
  })();

  // ---------------- GRAPHS PANEL (dens*) ----------------
  // Selects / checkboxes / radios
  $(document).on('change', '#densGroup', function(e) {
    gtag('event', 'dens_group_change', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#densCommon', function(e) {
    gtag('event', 'dens_common_toggle', { enabled: e.currentTarget.checked ? 'true' : 'false' });
  });
  $(document).on('change', 'input[name="densSpeciesType"]', function(e) {
    if (e.currentTarget.checked) {
      gtag('event', 'dens_species_type_select', { value: $(e.currentTarget).val() });
    }
  });
  $(document).on('change', '#CompareType', function(e) {
    gtag('event', 'compare_type_select', { value: $(e.currentTarget).val() });
  });

  // Graph options open/close
  $(document).on('click', '#densGraphButton', function() {
    gtag('event', 'graph_options_open', { panel: 'dens' });
  });
  $(document).on('click', '#CloseDisplayOptions', function() {
    gtag('event', 'display_options_close', { panel: 'dens' });
  });

  // Graphs tabset changes (virtual page view)
  $(document).on('shown.bs.tab', 'a[data-toggle="tab"]', function(e) {
    var $t = $(e.target), txt = $.trim($t.text()), href = $t.attr('href') || txt;
    if ($(e.target).closest('#densPanel').length) {
      gtag('event', 'dens_tab_change', { tab: txt });
      gtag('event', 'page_view', {
        page_title: 'Graphs: ' + txt,
        page_path: '/graphs/' + txt.replace(/\s+/g, '_').toLowerCase()
      });
    }
    if ($(e.target).closest('#IVPanel').length) {
      gtag('event', 'iv_tab_change', { tab: txt });
      gtag('event', 'page_view', {
        page_title: 'IV: ' + txt,
        page_path: '/iv/' + txt.replace(/\s+/g, '_').toLowerCase()
      });
    }
    if ($(e.target).closest('#SpeciesListPanel').length) {
      gtag('event', 'species_tab_change', { tab: txt });
      gtag('event', 'page_view', {
        page_title: 'Species: ' + txt,
        page_path: '/species/' + txt.replace(/\s+/g, '_').toLowerCase()
      });
    }
  });

  // Graph Display Controls
  $(document).on('change', '#densBaseColor', function(e) {
    gtag('event', 'dens_base_color_select', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#densCompareColor', function(e) {
    gtag('event', 'dens_compare_color_select', { value: $(e.currentTarget).val() });
  });
  $(document).on('change input', '#densPointSize', function(e) {
    gtag('event', 'dens_point_size_change', { value: $(e.currentTarget).val() });
  });
  $(document).on('change input', '#densFontSize', function(e) {
    gtag('event', 'dens_font_size_change', { value: $(e.currentTarget).val() });
  });

  // Downloads (Graphs panel)
  $(document).on('click', '#densGraphDownload', function() {
    gtag('event', 'dens_graph_download', { filetype: 'jpg' });
  });
  $(document).on('click', '#densWmfDownload', function() {
    gtag('event', 'dens_graph_download', { filetype: 'png' });
  });
  $(document).on('click', '#densTableDownload', function() {
    gtag('event', 'dens_table_download', { filetype: 'csv' });
  });

  // ---------------- IV PANEL ----------------
  $(document).on('change', '#IVGroup', function(e) {
    gtag('event', 'iv_group_change', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#IVCommon', function(e) {
    gtag('event', 'iv_common_toggle', { enabled: e.currentTarget.checked ? 'true' : 'false' });
  });
  $(document).on('change', '#IVPart', function(e) {
    gtag('event', 'iv_part_toggle', { enabled: e.currentTarget.checked ? 'true' : 'false' });
  });
  $(document).on('change input', '#IVTop', function(e) {
    gtag('event', 'iv_top_species_count_change', { value: $(e.currentTarget).val() });
  });

  // IV Display Controls open/close
  $(document).on('click', '#IVGraphButton', function() {
    gtag('event', 'iv_display_options_open', { panel: 'iv' });
  });
  $(document).on('click', '#CloseIVDisplayOptions', function() {
    gtag('event', 'iv_display_options_close', { panel: 'iv' });
  });

  // IV Display Controls
  $(document).on('change', '#IVBaseColor', function(e) {
    gtag('event', 'iv_base_color_select', { value: $(e.currentTarget).val() });
  });
  $(document).on('change input', '#IVFontSize', function(e) {
    gtag('event', 'iv_font_size_change', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#IVDensityColor', function(e) {
    gtag('event', 'iv_density_color_select', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#IVSizeColor', function(e) {
    gtag('event', 'iv_size_color_select', { value: $(e.currentTarget).val() });
  });
  $(document).on('change', '#IVDistributionColor', function(e) {
    gtag('event', 'iv_distribution_color_select', { value: $(e.currentTarget).val() });
  });

  // IV downloads
  $(document).on('click', '#IVGraphDownload', function() {
    gtag('event', 'iv_graph_download', { filetype: 'jpg' });
  });
  $(document).on('click', '#IVWmfDownload', function() {
    gtag('event', 'iv_graph_download', { filetype: 'wmf' });
  });
  $(document).on('click', '#IVTableDownload', function() {
    gtag('event', 'iv_table_download', { filetype: 'csv' });
  });

  // ---------------- SPECIES LISTS PANEL ----------------
  $(document).on('change', 'input[name="SpListType"]', function(e) {
    if (e.currentTarget.checked) {
      gtag('event', 'species_list_type_select', { value: $(e.currentTarget).val() });
    }
  });

  // Species tab changes handled above in shown.bs.tab

  // DT (SpeciesTable) via shiny:inputchanged (selection & search)
  document.addEventListener('shiny:inputchanged', function(e) {
    if (e.name === 'SpeciesTable_rows_selected') {
      var count = Array.isArray(e.value) ? e.value.length : (e.value ? 1 : 0);
      gtag('event', 'species_table_select_rows', { count: count });
    }
    if (e.name === 'SpeciesTable_search') {
      gtag('event', 'species_table_search', { query: String(e.value || '') });
    }
    if (e.name === 'SpeciesTable_state') {
      gtag('event', 'species_table_state_change', { state: e.value });
    }
  });

  // ---------------- TOP NAVBAR (virtual pageviews) ----------------
  document.addEventListener('shiny:inputchanged', function(e) {
    if (e.name === 'MainNavBar' && e.value) {
      var tab = String(e.value);
      gtag('event', 'nav_change', { action: 'main navbar', label: tab });
      gtag('event', 'page_view', {
        page_title: 'Tab: ' + tab,
        page_path: '/' + tab.replace(/\s+/g, '_').toLowerCase()
      });
    }
  });

  // ===========================================================
  // OPTIONAL: Generic fallbacks (covers widgets not explicitly named)
  // ===========================================================
  $(document).on('change', 'select', function(e) {
    if (!e.currentTarget.id) return;
    gtag('event', 'widget', {
      action: 'select change',
      id: e.currentTarget.id,
      label: $(e.currentTarget).val()
    });
  });

  $(document).on('click', 'button', function(e) {
    gtag('event', 'button', { action: 'click', id: e.currentTarget.id || null });
  });

  $(document).on('change', 'input[type="checkbox"]', function(e) {
    gtag('event', 'widget', {
      action: 'checkbox toggle',
      id: e.currentTarget.id || e.currentTarget.name || null,
      value: e.currentTarget.checked ? 'true' : 'false'
    });
  });

  $(document).on('change', 'input[type="radio"]', function(e) {
    if (e.currentTarget.checked) {
      gtag('event', 'widget', {
        action: 'radio select',
        id: e.currentTarget.name || 'radio',
        label: e.currentTarget.value
      });
    }
  });

  $(document).on('change input', '.js-range-slider', function(e) {
    gtag('event', 'widget', {
      action: 'slider change',
      id: e.currentTarget.id || null,
      value: $(e.currentTarget).val()
    });
  });
</script>
